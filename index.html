<!DOCTYPE html>
<html>
<head>
<title>OC WIKI</title>

<style>
body {
	margin: 0;
	font-family: Georgia;
	background: #0f0f14;
	color: #f5f5f5;

	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}

h1{
	margin-bottom: 10px;
	letter-spacing: 2px;
}

p{
	color: #aaa;
	margin-bottom: 30px;
}


.wiki-container{
    display: grid;
	grid-template-columns: repeat(4, 1fr);
    gap: 20px;

	width: 90%;
	max-width: 1000px;
}

.character{
	width: 200px;

	padding: 20px;
	padding-bottom: 70px;
	
	background: #1c1c26;
	border-radius: 15px;

	text-align: center:
	cursor: pointer;

	transition: transform 0.3s ease;

	position: relative;
	overflow: hidden;

	display: flex;
	flex-direction: column;
	align-items: center;
}


.drawer{
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;

	background: rgba(0,0,0,0.85);
	padding: 12px;

	transform: translateY(100%);
	transition: transform 0.35s ease;
}

.character:hover .drawer{
	transform: translateY(0%)
}

.character:hover{
	transform: scale(1.05);
}


.character a{
	text-decoration: none;
	color: white;
	font-size: 18px;
}


@media (max-width: 900px) {
    .wiki-container{
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .wiki-container{
        grid-template-columns: 1fr;
    }
}





 .avatar{
	width: 90px;
	height: 90px;

	border-radius: 50%;
	object-fit: cover;

	margin-bottom: 10px;

	border: 2px solid #444;

	transition: transform 0.3s ease;
}

.character:hover .avatar{
	transform: scale(1.1);
}




.character-link{
	text-decoration: none;
	color: inherit;
}


</style>


</head>

<body>

<h1>Character Wiki</h1>
